<!DOCTYPE html>
<html lang="es">
<head>
<script src="js/core/api.js"></script>
<script src="shared/domain/climate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24523a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi campo hoy · campo</title>
<script src="js/almacen.js"></script>
<script src="js/ruta.js"></script>
<script src="js/clima.js"></script>
<script src="js/resumen.js"></script>
<script>
  if (!Ruta.leer('parcela')) location.replace('ubicar-chacra.html');
  else if (!Ruta.leer('perfil')) location.replace('index.html');
</script>
<style>
  :root{
    --verde:#24523a; --verde-claro:#e8f0ea; --fondo:#f5f3ee;
    --texto:#1d2b22; --gris:#5f6b63; --borde:#e5e2da;
    --ok:#2f7d4f; --ok-fondo:#e3f2e8;
    --atencion:#b45309; --atencion-fondo:#fdf1e4;
    --alto:#b42318; --alto-fondo:#fde8e6;
    --neutro:#5f6b63; --neutro-fondo:#efeee9;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:20px; background:var(--fondo); color:var(--texto);
    padding:20px 16px 40px;
  }
  main{max-width:480px; margin:0 auto}
  .kicker{font-size:15px; font-weight:800; color:var(--verde); letter-spacing:.05em}
  h1{font-size:28px; margin:6px 0 16px; line-height:1.2}

  .principal{
    background:var(--verde); color:#fff; border-radius:22px; padding:22px; margin-bottom:16px;
  }
  .principal .frase{font-size:26px; font-weight:800; line-height:1.25}
  .principal .fecha{opacity:.85; margin-top:8px; font-size:16px}

  .boton-voz{
    font:inherit; font-weight:800; width:100%; min-height:60px; margin-top:18px;
    border-radius:16px; border:2px solid #fff; background:#fff; color:var(--verde); cursor:pointer;
  }
  .boton-voz[hidden]{display:none}

  .tarjeta{
    display:flex; align-items:center; gap:14px; background:#fff; border:2px solid var(--borde);
    border-radius:20px; padding:16px; margin-bottom:12px; min-height:96px;
  }
  .tarjeta .ico{font-size:40px; flex-shrink:0; width:60px; height:60px; border-radius:16px; display:grid; place-items:center; background:var(--neutro-fondo)}
  .tarjeta .txt{flex:1}
  .tarjeta .titulo{font-size:18px; font-weight:800; color:var(--gris); display:block}
  .tarjeta .frase{font-size:19px; font-weight:700; display:block; margin-top:2px; line-height:1.3}
  .tarjeta.verde{border-color:var(--ok)} .tarjeta.verde .ico{background:var(--ok-fondo)}
  .tarjeta.naranja{border-color:var(--atencion)} .tarjeta.naranja .ico{background:var(--atencion-fondo)}
  .tarjeta.rojo{border-color:var(--alto)} .tarjeta.rojo .ico{background:var(--alto-fondo)}
  .tarjeta.neutro{border-color:var(--borde)}

  details{background:#fff; border:1px solid var(--borde); border-radius:16px; padding:12px 16px; margin-top:8px}
  summary{font-size:18px; font-weight:800; color:var(--verde); cursor:pointer; min-height:44px; display:flex; align-items:center}
  details .fila{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--borde); font-size:17px}
  details .fila:last-child{border-bottom:none}
  details .fila span:last-child{font-weight:700; white-space:nowrap}
  details p{font-size:15px; color:var(--gris); line-height:1.4; margin:10px 0 0}

  .cargando{text-align:center; padding:40px 0; color:var(--gris)}
  .aviso{background:var(--atencion-fondo); color:var(--atencion); border-radius:16px; padding:14px 16px; margin-bottom:12px; line-height:1.4}
  .volver{
    font:inherit; font-weight:800; width:100%; min-height:60px; margin-top:12px;
    border-radius:16px; border:2px solid var(--verde); background:#fff; color:var(--verde); cursor:pointer;
  }
  input, select, textarea{font-size:16px}
  body{min-height:100dvh}
</style>
<link rel="stylesheet" href="css/components.css">
<script src="js/core/i18n.js" defer></script>
<script src="js/ui/language-switch.js" defer></script>
<script src="js/ui/shell.js" defer></script>
</head>
<body>
<main>
  <div class="kicker">MI CAMPO HOY</div>
  <h1>Así está tu campo</h1>

  <div id="contenido"><p class="cargando">Revisando el clima de tu zona…</p></div>

  <button class="volver" onclick="location.href='index.html'">← Volver al menú</button>
</main>

<script>
/* ---------- datos ---------- */
const ultimoDia = c => c.dias[c.dias.length - 1];

function resumenDelCache(cache){
  const u5 = cache.dias.slice(-5);
  const hoy = ultimoDia(cache);
  const media = arr => {
    const a = arr.filter(x => x != null);
    return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  };
  return {
    suelo: hoy.suelo,
    lluviaHoy: hoy.lluvia,
    lluviaMax: Math.max(0, ...u5.map(d => d.lluvia ?? 0)),
    viento: media(u5.map(d => d.viento)),
    tmed: hoy.tmed,
    fecha: hoy.fecha
  };
}

function fechaBonita(iso){
  const d = new Date(iso.slice(0,4) + '-' + iso.slice(4,6) + '-' + iso.slice(6,8) + 'T12:00:00');
  return d.toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long' });
}

/* ---------- pintar ---------- */
function pintar(clima, aviso){
  const r = Resumen.armar(clima);
  const fecha = clima.fecha ? fechaBonita(clima.fecha) : 'Hoy';

  const tarjetas = r.tarjetas.map(t => `
    <div class="tarjeta ${t.color}">
      <div class="ico">${t.ico}</div>
      <div class="txt">
        <span class="titulo">${t.titulo}</span>
        <span class="frase">${t.frase}</span>
      </div>
    </div>`).join('');

  const detalles = `
    <details>
      <summary>Ver detalles</summary>
      <div class="fila"><span>Temperatura</span><span>${clima.tmed == null ? '--' : Math.round(clima.tmed) + ' °C'}</span></div>
      <div class="fila"><span>Lluvia del día</span><span>${clima.lluviaHoy == null ? '--' : clima.lluviaHoy.toFixed(1) + ' mm'}</span></div>
      <div class="fila"><span>Lluvia más fuerte de la semana</span><span>${clima.lluviaMax.toFixed(1)} mm</span></div>
      <div class="fila"><span>Viento promedio</span><span>${clima.viento == null ? '--' : Math.round(clima.viento) + ' km/h'}</span></div>
      <div class="fila"><span>Humedad de la tierra</span><span>${clima.suelo == null ? '--' : Math.round(clima.suelo) + ' %'}</span></div>
      <p>Estos números vienen de satélites de la NASA y describen tu zona, no solo tu parcela.</p>
    </details>`;

  document.getElementById('contenido').innerHTML = `
    <div class="principal">
      <div class="frase">${r.principal}</div>
      <div class="fecha">${fecha}</div>
      <button class="boton-voz" id="btnVoz">🔊 Escuchar el resumen</button>
    </div>
    ${aviso ? `<div class="aviso">${aviso}</div>` : ''}
    ${tarjetas}
    ${detalles}`;

  const btn = document.getElementById('btnVoz');
  if ('speechSynthesis' in window) {
    btn.onclick = () => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(r.texto);
      u.lang = 'es-PE';
      u.rate = 0.85;
      speechSynthesis.speak(u);
    };
  } else {
    btn.hidden = true;
  }
}

/* ---------- inicio ---------- */
async function iniciar(){
  const parcela = Ruta.leer('parcela');
  try {
    const cache = await Clima.obtener(parcela);
    pintar(resumenDelCache(cache));
  } catch {
    const viejo = Clima.leerCache();
    if (viejo) {
      pintar(resumenDelCache(viejo), 'Sin señal ahora. Estos datos son de ' +
        new Date(viejo.actualizado).toLocaleDateString('es-PE') + '.');
    } else {
      document.getElementById('contenido').innerHTML =
        '<div class="aviso">Todavía no hay datos del clima. Conéctate a internet y vuelve a abrir esta pantalla.</div>';
    }
  }
}

iniciar();
</script>
</body>
</html>
