<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="data/brand/favicon.ico?release=1.0.2" sizes="any">
<link rel="icon" type="image/png" href="data/brand/favicon-32.png?release=1.0.2" sizes="32x32">
<link rel="apple-touch-icon" href="data/brand/apple-touch-icon.png?release=1.0.2">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});</script>
<script src="js/core/api.js?release=1.0.2"></script>
<script src="shared/domain/climate.js?release=1.0.2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24523a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ubica tu parcela · campo</title>
<link rel="stylesheet" href="css/vendor/leaflet.1.9.4.min.css?release=1.0.2">
<script src="js/vendor/leaflet.1.9.4.min.js?release=1.0.2"></script>
<script src="js/almacen.js?release=1.0.2"></script>
<script src="js/parcela-datos.js?release=1.0.2"></script>
<script src="js/ruta.js?release=1.0.2"></script>
<script src="js/ubicacion.js?release=1.0.2"></script>
<script src="js/core/maps.js?release=1.0.2"></script>
<style>
  :root{
    --verde:#24523a; --verde-claro:#e8f0ea; --fondo:#f5f3ee;
    --texto:#1d2b22; --gris:#5f6b63; --borde:#cfd8d1;
    --aviso:#fdf1e4; --aviso-txt:#8a4a06;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{
    display:flex; flex-direction:column; height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:19px; background:var(--fondo); color:var(--texto);
  }

  header{padding:14px 16px 10px; padding-top:calc(14px + env(safe-area-inset-top)); background:#fff; border-bottom:1px solid var(--borde)}
  .paso{font-size:14px; font-weight:800; color:var(--gris); letter-spacing:.04em}
  h1{font-size:26px; line-height:1.2; margin:4px 0 4px; color:var(--verde)}
  #ayuda{margin:0; color:var(--gris); line-height:1.4; font-size:17px}

  .mapa-wrap{position:relative; flex:1; min-height:200px}
  #mapa{position:absolute; inset:0}
  [hidden]{display:none!important}

  .selector{
    flex:1; overflow:auto; padding:22px 16px;
  }
  .selector-contenido{max-width:560px; margin:0 auto}
  .selector h2{font-size:21px; line-height:1.25; color:var(--verde); margin:0 0 8px}
  .selector .intro{color:var(--gris); line-height:1.45; margin:0 0 18px}
  .opcion-ubicacion{
    display:flex; align-items:center; gap:14px; width:100%; min-height:84px;
    padding:14px; margin:0 0 14px; text-align:left; font:inherit; color:var(--texto);
    background:#fff; border:2px solid var(--borde); border-radius:18px; cursor:pointer;
  }
  .opcion-ubicacion:focus-visible,.resultado:focus-visible{outline:3px solid #6aa886; outline-offset:2px}
  .opcion-ubicacion .icono{
    display:grid; place-items:center; width:52px; height:52px; flex:none;
    border-radius:15px; background:var(--verde-claro); font-size:27px;
  }
  .opcion-ubicacion .texto{display:block}
  .opcion-ubicacion strong{display:block; color:var(--verde); font-size:18px}
  .opcion-ubicacion small{display:block; margin-top:3px; color:var(--gris); font-size:15px; line-height:1.3}
  .buscador{padding:15px; background:#fff; border:1px solid var(--borde); border-radius:18px}
  .buscador label{display:block; margin-bottom:8px; color:var(--verde); font-weight:800}
  .buscador input{
    width:100%; min-height:52px; padding:10px 12px; font:inherit; font-size:16px;
    color:var(--texto); background:#fff; border:2px solid var(--borde); border-radius:12px;
  }
  .buscador input:focus{outline:3px solid #c9e2d3; border-color:var(--verde)}
  .ayuda-busqueda{margin:8px 0 0; color:var(--gris); font-size:14px; line-height:1.4}
  #sugerencias{list-style:none; margin:8px 0 0; padding:0}
  #sugerencias li{margin-top:6px}
  #sugerencias button{
    width:100%; min-height:48px; padding:10px 12px; text-align:left; font:inherit; font-size:16px;
    color:var(--texto); background:#fff; border:1px solid var(--borde); border-radius:11px; cursor:pointer;
  }
  #sugerencias button:hover{background:var(--verde-claro); border-color:var(--verde)}
  #sugerencias .sin-resultados{padding:10px 2px; color:var(--gris); font-size:15px; line-height:1.4}
  .cambiar{
    display:block; margin:10px auto 0; min-height:44px; padding:6px 12px;
    font:inherit; font-size:15px; font-weight:700; color:var(--verde);
    background:transparent; border:0; cursor:pointer;
  }

  /* Pin fijo en el centro: la punta queda exactamente sobre el centro del mapa */
  .pin{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-100%);
    font-size:46px; line-height:1; pointer-events:none; z-index:500;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
  }

  .gps{
    position:absolute; top:12px; right:12px; z-index:600;
    font:inherit; font-weight:700; font-size:16px; min-height:48px; padding:0 14px;
    border-radius:14px; border:2px solid var(--verde); background:#fff; color:var(--verde); cursor:pointer;
  }
  .gps:disabled{opacity:.5}

  footer{
    background:#fff; border-top:1px solid var(--borde);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .estado{
    min-height:0; margin:0 0 10px; line-height:1.4;
  }
  .estado:empty{display:none}
  .estado.info{background:var(--verde-claro); color:var(--verde); border-radius:14px; padding:12px 14px; font-weight:700}
  .estado.aviso{background:var(--aviso); color:var(--aviso-txt); border-radius:14px; padding:12px 14px}

  .confirmar{
    font:inherit; font-weight:800; width:100%; min-height:60px;
    border-radius:16px; border:2px solid var(--verde); background:var(--verde); color:#fff; cursor:pointer;
  }
  .confirmar:disabled{opacity:.5; cursor:wait}
  input, select, textarea{font-size:16px}
  body{min-height:100dvh}
</style>
<link rel="stylesheet" href="css/components.css?release=1.0.2">
<script src="js/core/i18n.js?release=1.0.2" defer></script>
<script src="js/ui/language-switch.js?release=1.0.2" defer></script>
<script src="js/ui/screens.js?release=1.0.2" defer></script>
<script src="js/ui/shell.js?release=1.0.2" defer></script>
</head>
<body>

<header>
  <div class="paso">PASO 1 DE 5</div>
  <h1>¿Dónde está tu parcela?</h1>
  <p id="ayuda">Elige cómo quieres encontrarla.</p>
</header>

<section id="selectorUbicacion" class="selector">
  <div class="selector-contenido">
    <button id="btnGpsInicial" class="opcion-ubicacion" type="button">
      <span class="icono">📍</span>
      <span class="texto">
        <strong>Usar mi GPS</strong>
        <small>Permite tu ubicación para encontrar tu terreno.</small>
      </span>
    </button>
    <p id="avisoGps" class="ayuda-busqueda" hidden></p>

    <form class="buscador" id="formBuscar" role="search">
      <label for="buscar">Buscar mi localidad</label>
      <input id="buscar" type="search" placeholder="Ej.: Huamancaca, Puno, Chancay…" autocomplete="off" aria-controls="sugerencias">
      <button id="btnBuscar" class="confirmar" type="submit">Buscar localidad</button>
      <p class="ayuda-busqueda">Escribe al menos 2 letras y elige un resultado.</p>
      <ul id="sugerencias" aria-live="polite"></ul>
    </form>
    <button id="btnManual" class="opcion-ubicacion" type="button">
      <span class="icono" aria-hidden="true">🗺️</span>
      <span class="texto"><strong>Buscar en el mapa</strong><small>Mueve el mapa y coloca el pin sobre tu parcela.</small></span>
    </button>
  </div>
</section>

<div id="mapaVista" class="mapa-wrap" hidden>
  <div id="mapa"></div>
  <p id="avisoMapa" class="mapa-aviso" role="status" hidden></p>
  <div class="pin" aria-hidden="true"><svg viewBox="0 0 32 44" width="40" height="56"><path d="M16 42S2 25 2 16a14 14 0 1 1 28 0c0 9-14 26-14 26Z" fill="#ef476f" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="#fff"/></svg></div>
  <button id="btnGps" class="gps">Usar mi GPS</button>
  <div class="mapa-zoom"><button id="mapZoomIn" type="button" aria-label="Acercar mapa">+</button><button id="mapZoomOut" type="button" aria-label="Alejar mapa">−</button></div>
</div>

<footer id="pieMapa" hidden>
  <div id="estado" class="estado"></div>
  <p id="coordenadas" class="ayuda-busqueda"></p>
  <button id="btnConfirmar" class="confirmar">Esta es mi parcela</button>
  <button id="btnCambiar" class="cambiar" type="button">← Elegir otra forma de ubicarme</button>
</footer>

<dialog id="gpsHelp" class="gps-help" aria-labelledby="gpsHelpTitle">
  <button id="gpsHelpClose" class="gps-help-close" type="button" data-i18n="gps.close">Cerrar</button>
  <h2 id="gpsHelpTitle" data-i18n="gps.title">Activa el permiso de ubicación</h2>
  <p id="gpsHelpMessage"></p>
  <ol id="gpsHelpSteps"></ol>
  <div id="gpsNative"></div>
  <p id="gpsHelpStatus" role="status"></p>
  <button id="gpsCheck" class="confirmar" type="button" data-i18n="gps.check">Ya lo habilité. Comprobar GPS</button>
  <button id="gpsManual" class="cambiar" type="button" data-i18n="gps.manual">Prefiero ubicarme en el mapa</button>
</dialog>
<script src="js/ubicar.chacra.js?release=1.0.2"></script>
</body>
</html>
