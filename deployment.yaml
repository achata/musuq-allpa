apiVersion: apps/v1
kind: Deployment
metadata:
  name: musuq-allpha
  namespace: default
  labels:
    app: musuq-allpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musuq-allpha
  template:
    metadata:
      labels:
        app: musuq-allpha
    spec:
      containers:
        - name: musuq-allpha
          image: musuq-allpha:musuq-v1.0.2-20261116
          imagePullPolicy: Never
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: CORS_ORIGINS
              value: "https://musuq.cholotec.dev,http://localhost:3000"
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: musuq-google-maps
                  key: api-key
                  optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: musuq-allpha-service
  namespace: default
  labels:
    app: musuq-allpha
spec:
  type: NodePort
  selector:
    app: musuq-allpha
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 32123
      protocol: TCP
