<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="data/brand/favicon.ico?release=1.0.2" sizes="any">
<link rel="icon" type="image/png" href="data/brand/favicon-32.png?release=1.0.2" sizes="32x32">
<link rel="apple-touch-icon" href="data/brand/apple-touch-icon.png?release=1.0.2">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});</script>
<script src="js/core/api.js?release=1.0.2"></script>
<script src="shared/domain/climate.js?release=1.0.2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24523a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="campo">
<title>campo · Cultiva con confianza</title>
<script src="js/almacen.js?release=1.0.2"></script>
<script src="js/ruta.js?release=1.0.2"></script>
<style>
  :root{
    --verde:#24523a; --verde-claro:#e8f0ea; --fondo:#f5f3ee;
    --texto:#1d2b22; --gris:#5f6b63; --borde:#e5e2da; --aviso:#fdf1e4; --aviso-txt:#8a4a06;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:19px; background:var(--fondo); color:var(--texto);
    padding-bottom:env(safe-area-inset-bottom);
  }
  a,button{touch-action:manipulation}

  /* Pantalla de carga: aparece en cada entrada */
  #splash{
    position:fixed; inset:0; z-index:999; background:var(--verde); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .35s ease;
  }
  #splash.oculto{opacity:0; pointer-events:none}
  #splash .logo{font-size:64px}
  #splash .marca{font-size:34px; font-weight:800}
  #splash .espera{font-size:17px; opacity:.9}
  .giro{width:38px; height:38px; border:4px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; margin-top:10px; animation:giro 1s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}

  header{
    background:#fff; border-bottom:1px solid var(--borde);
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    font-size:24px; font-weight:800; color:var(--verde);
  }
  main{max-width:480px; margin:0 auto; padding:24px 16px}
  .kicker{font-size:14px; font-weight:800; color:var(--verde); letter-spacing:.06em}
  h1{font-size:30px; line-height:1.2; margin:6px 0 6px}
  .sub{color:var(--gris); margin:0 0 22px; line-height:1.4}
  h2{font-size:20px; margin:26px 0 10px}

  .parcela{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--texto);
    background:#fff; border:1px solid var(--borde); border-radius:18px;
    padding:18px; margin-bottom:12px; min-height:88px;
  }
  .parcela.incompleta{border-style:dashed; border-color:#d9b98a; background:var(--aviso)}
  .parcela .ico{
    width:56px; height:56px; border-radius:16px; background:var(--verde-claro);
    display:grid; place-items:center; font-size:28px; flex-shrink:0;
  }
  .parcela.incompleta .ico{background:#fff}
  .parcela .txt{flex:1; min-width:0}
  .parcela .titulo{font-size:21px; font-weight:800; color:var(--verde); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .parcela .detalle{font-size:16px; color:var(--gris); display:block; margin-top:4px; line-height:1.3}
  .parcela.incompleta .detalle{color:var(--aviso-txt); font-weight:700}
  .parcela .flecha{font-size:26px; color:var(--verde)}

  .agregar{
    font:inherit; font-weight:800; width:100%; min-height:60px; margin-top:6px;
    border-radius:16px; border:2px dashed var(--verde); background:#fff; color:var(--verde); cursor:pointer;
  }

  .opcion{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--texto);
    background:#fff; border:1px solid var(--borde); border-radius:18px;
    padding:16px; margin-bottom:12px; min-height:76px;
  }
  .opcion .ico{width:52px; height:52px; border-radius:14px; background:var(--verde-claro); display:grid; place-items:center; font-size:26px; flex-shrink:0}
  .opcion .titulo{font-size:20px; font-weight:800; color:var(--verde); display:block}
  .opcion .detalle{font-size:15px; color:var(--gris); display:block; margin-top:3px; line-height:1.3}
  .opcion .flecha{font-size:24px; color:var(--verde); margin-left:auto}

  .vacio{background:#fff; border:1px solid var(--borde); border-radius:18px; padding:18px; line-height:1.45; color:var(--gris)}
</style>
<link rel="stylesheet" href="css/components.css?release=1.0.2">
<script src="js/core/i18n.js?release=1.0.2" defer></script>
<script src="js/ui/language-switch.js?release=1.0.2" defer></script>
<script src="js/ui/screens.js?release=1.0.2" defer></script>
<script src="js/ui/shell.js?release=1.0.2" defer></script>
</head>
<body>

<div id="splash">
  <div class="logo"><img src="data/brand/musuq-allpa.jpg" alt="Musuq Allpa" width="220" height="180"></div>
  <div class="marca">Musuq Allpa</div>
  <div class="splash-version">v.1.0.2</div>
  <div class="espera">Preparando tu parcela…</div>
  <div class="giro"></div>
</div>

<header>🌿 campo</header>

<main>
  <div class="kicker">CULTIVA CON CONFIANZA</div>
  <h1>Mis parcelas</h1>
  <p class="sub">Toca una parcela para ver qué sembrar, el clima de hoy y consejos.</p>

  <div id="lista"></div>
  <button class="agregar" id="btnAgregar">+ Agregar parcela</button>

  <div id="consejo" class="vacio" style="display:none; background:var(--aviso); color:var(--aviso-txt); border:none; margin-top:12px">
    📲 Para no perder tus datos en iPhone, toca el botón Compartir de Safari y elige <strong>Agregar a pantalla de inicio</strong>.
  </div>
</main>

<script>
const MIN_ESPERA_MS = 650;
const inicio = Date.now();

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pintarLista(){
  const lista = Almacen.todas();
  const cont = document.getElementById('lista');

  if (!lista.length) {
    cont.innerHTML = `<div class="vacio">Todavía no tienes parcelas. Toca <strong>Agregar parcela</strong> para empezar.</div>`;
    return;
  }

  cont.innerHTML = lista.map(p => {
    const cultivos = p.perfil && (p.perfil.cultivos || []).length
      ? p.perfil.cultivos.map(c => c.nombre).join(', ')
      : null;
    const detalle = !p.perfil
      ? 'Falta completar'
      : `${esc(p.altitud ?? '--')} metros · ${esc(cultivos || 'Sin cultivos registrados')}`;
    return `
      <div class="parcela-fila"><a class="parcela ${p.perfil ? '' : 'incompleta'}" href="parcela.html?id=${encodeURIComponent(p.id)}">
        <span class="ico">📍</span>
        <span class="txt">
          <span class="titulo" data-user-value>${esc(p.nombre)}</span>
          <span class="detalle">${detalle}</span>
        </span>
        <span class="flecha">→</span>
      </a><button type="button" class="eliminar-parcela" data-eliminar="${esc(p.id)}" aria-label="${esc(CampoI18n.t('parcels.deleteLabel', { name: p.nombre }))}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg><span>Quitar</span></button></div>`;
  }).join('');
}

document.getElementById('btnAgregar').addEventListener('click', () => {
  Almacen.borrarBorrador();
  location.href = 'ubicar-chacra.html';
});

document.getElementById('lista').addEventListener('click', e => {
  const button = e.target.closest('[data-eliminar]');
  if (!button) return;
  const parcel = Almacen.todas().find(p => p.id === button.dataset.eliminar);
  if (parcel && confirm(CampoI18n.t('parcels.confirmDelete', { name: parcel.nombre }))) {
    Almacen.eliminar(parcel.id);
    pintarLista();
  }
});

document.addEventListener('campo:language', pintarLista);
window.addEventListener('load', async () => {
  await CampoI18n.ready;
  const resto = Math.max(0, MIN_ESPERA_MS - (Date.now() - inicio));
  setTimeout(() => {
    const todas = Almacen.todas();

    pintarLista();
    document.getElementById('splash').classList.add('oculto');

    const esIphone = /iPhone|iPad/.test(navigator.userAgent);
    const instalada = window.navigator.standalone === true;
    if (esIphone && !instalada) document.getElementById('consejo').style.display = 'block';
  }, resto);
});
</script>
</body>
</html>
