<!DOCTYPE html>
<html lang="es">
<head>
<script src="js/core/api.js"></script>
<script src="shared/domain/climate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24523a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi campo · campo</title>
<script src="js/almacen.js"></script>
<style>
  :root{--verde:#24523a; --verde-claro:#e8f0ea; --fondo:#f5f3ee; --texto:#1d2b22; --gris:#5f6b63; --borde:#e5e2da; --peligro:#b42318}
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:20px; background:var(--fondo); color:var(--texto); padding:20px 16px 40px}
  main{max-width:480px; margin:0 auto}
  .kicker{font-size:15px; font-weight:800; color:var(--verde); letter-spacing:.05em}
  h1{font-size:28px; margin:6px 0 16px}
  h2{font-size:20px; margin:24px 0 10px}

  .activa{background:var(--verde); color:#fff; border-radius:20px; padding:20px; margin-bottom:12px}
  .activa .nombre{font-size:24px; font-weight:800}
  .activa .detalle{opacity:.9; margin-top:6px; line-height:1.4}

  .accion{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:var(--texto);
    background:#fff; border:2px solid var(--borde); border-radius:18px; padding:16px; margin-bottom:12px; min-height:88px; cursor:pointer;
  }
  .accion .ico{font-size:34px; flex-shrink:0; width:56px; height:56px; border-radius:14px; background:var(--verde-claro); display:grid; place-items:center}
  .accion .t{display:block; font-size:20px; font-weight:800; color:var(--verde)}
  .accion .d{display:block; font-size:16px; color:var(--gris); margin-top:2px; line-height:1.3}

  .parcela{background:#fff; border:2px solid var(--borde); border-radius:18px; padding:16px; margin-bottom:12px}
  .parcela.on{border-color:var(--verde)}
  .parcela .n{font-size:20px; font-weight:800}
  .parcela .d{color:var(--gris); font-size:16px; margin-top:4px; line-height:1.35}
  .parcela .botones{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .btn{font:inherit; font-weight:800; min-height:48px; padding:0 16px; border-radius:14px; border:2px solid var(--verde); background:#fff; color:var(--verde); cursor:pointer}
  .btn.sec{background:var(--verde); color:#fff}
  .btn.peligro{border-color:var(--peligro); color:var(--peligro)}

  .volver{font:inherit; font-weight:800; width:100%; min-height:60px; margin-top:16px; border-radius:16px; border:2px solid var(--verde); background:#fff; color:var(--verde); cursor:pointer}
  input, select, textarea{font-size:16px}
  body{min-height:100dvh}
</style>
<link rel="stylesheet" href="css/components.css">
<script src="js/core/i18n.js" defer></script>
<script src="js/ui/language-switch.js" defer></script>
<script src="js/ui/shell.js" defer></script>
</head>
<body>
<main>
  <div class="kicker">MI CAMPO</div>
  <h1>Mi parcela</h1>
  <div id="contenido"></div>
  <button class="volver" onclick="location.href='index.html'">← Volver al menú</button>
</main>

<script>
function pintar(){
  const lista = Almacen.todas();
  const act = Almacen.activa();

  const activaHTML = act ? `
    <div class="activa">
      <div class="nombre">${act.nombre}</div>
      <div class="detalle">
        ${act.altitud ?? '--'} metros de altura<br>
        ${act.perfil ? (act.perfil.cultivos || []).map(c => c.nombre).join(', ') || 'Sin cultivos todavía' : 'Falta completar el registro'}
      </div>
    </div>` : '';

  const listaHTML = lista.map(p => `
    <div class="parcela ${act && p.id === act.id ? 'on' : ''}">
      <div class="n">${p.nombre}</div>
      <div class="d">${p.altitud ?? '--'} metros · ${p.perfil ? 'Registro completo' : 'Falta completar'}</div>
      <div class="botones">
        ${act && p.id === act.id ? '' : `<button class="btn sec" data-activar="${p.id}">Usar esta</button>`}
        <button class="btn peligro" data-borrar="${p.id}">Quitar</button>
      </div>
    </div>`).join('');

  document.getElementById('contenido').innerHTML = `
    ${activaHTML}

    <h2>Lo que puedes hacer</h2>

    <button class="accion" data-ir="cambiar-datos">
      <span class="ico">✏️</span>
      <span>
        <span class="t">Cambiar datos</span>
        <span class="d">Cambió tu cosecha o el riego. Vuelve a responder las preguntas.</span>
      </span>
    </button>

    <button class="accion" data-ir="otra-parcela">
      <span class="ico">➕</span>
      <span>
        <span class="t">Tengo otra parcela</span>
        <span class="d">Agrega un terreno nuevo con su ubicación.</span>
      </span>
    </button>

    <h2>Tus parcelas</h2>
    ${listaHTML || '<p>Todavía no tienes parcelas guardadas.</p>'}
  `;
}

document.addEventListener('click', e => {
  const ir = e.target.closest('[data-ir]');
  if (ir) {
    if (ir.dataset.ir === 'cambiar-datos') {
      const p = Almacen.activa();
      if (p && p.perfil) {
        Almacen.guardarBorrador({
          cultivos: p.perfil.cultivos || [],
          riego: p.perfil.riego,
          insumos: p.perfil.insumos || [],
          editando: true
        });
      }
      location.href = 'conocerte.html';
    }
    if (ir.dataset.ir === 'otra-parcela') {
      Almacen.borrarBorrador();
      location.href = 'ubicar-chacra.html';
    }
    return;
  }

  const activar = e.target.closest('[data-activar]');
  if (activar) {
    Almacen.activar(activar.dataset.activar);
    pintar();
    return;
  }

  const borrar = e.target.closest('[data-borrar]');
  if (borrar) {
    const parcela = Almacen.todas().find(item => item.id === borrar.dataset.borrar);
    if (parcela && confirm(`¿Quitar "${parcela.nombre}"? Se borran sus respuestas.`)) {
      Almacen.eliminar(parcela.id);
      pintar();
    }
  }
});

pintar();
</script>
</body>
</html>
